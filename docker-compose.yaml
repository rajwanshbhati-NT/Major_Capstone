services:

  # AIRFLOW METADATA DB 
  postgres:
    image: postgres:13
    container_name: postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro

  # WAREHOUSE (DATA) DB 
  warehouse-db:
    image: postgres:13
    container_name: warehouse-db
    environment:
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: warehouse
      POSTGRES_DB: warehouse
    ports:
      - "5435:5432"
    volumes:
      - warehouse-db-volume:/var/lib/postgresql/data
      - ./sql/employees_ddl.sql:/docker-entrypoint-initdb.d/employees_ddl.sql

  # AIRFLOW INIT 
  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile
    image: airflow-custom:2.9.3
    container_name: airflow-init
    depends_on:
      - postgres
      - warehouse-db          
    user: "0:0"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__WEBSERVER__SECRET_KEY: my_super_secret_key
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
      INGESTION_AES_KEY: ${INGESTION_AES_KEY}
      # ADD THESE:
      WAREHOUSE_JDBC_URL: "jdbc:postgresql://warehouse-db:5432/warehouse"
      WAREHOUSE_USERNAME: "warehouse"
      WAREHOUSE_PASSWORD: "warehouse"
    command: >-
      bash -c "mkdir -p /opt/airflow/dags /opt/airflow/scripts /opt/airflow/logs /opt/airflow/plugins &&
      airflow db init &&
      airflow users create
      --username airflow
      --password airflow
      --firstname admin
      --lastname user
      --role Admin
      --email admin@gmail.com"
    volumes:
      - ./airflow_505:/opt/airflow
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - ./data:/opt/airflow/data
      - ./beam-java/target:/opt/airflow/beam-java/target

  # AIRFLOW WEBSERVER 
  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile
    image: airflow-custom:2.9.3
    container_name: airflow-webserver
    depends_on:
      - airflow-init
    user: "0:0"
    ports:
      - "8082:8080"
    command: bash -c "airflow webserver"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: my_super_secret_key
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
      INGESTION_AES_KEY: ${INGESTION_AES_KEY}
      # ADD THESE:
      WAREHOUSE_JDBC_URL: "jdbc:postgresql://warehouse-db:5432/warehouse"
      WAREHOUSE_USERNAME: "warehouse"
      WAREHOUSE_PASSWORD: "warehouse"
    volumes:
      - ./airflow_505:/opt/airflow
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - ./data:/opt/airflow/data
      - ./beam-java/target:/opt/airflow/beam-java/target

  # AIRFLOW SCHEDULER
  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: airflow-custom:2.9.3
    container_name: airflow-scheduler
    depends_on:
      - airflow-init
    user: "0:0"
    command: bash -c "airflow scheduler"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: my_super_secret_key
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
      INGESTION_AES_KEY: ${INGESTION_AES_KEY}
      WAREHOUSE_JDBC_URL: "jdbc:postgresql://warehouse-db:5432/warehouse"
      WAREHOUSE_USERNAME: "warehouse"
      WAREHOUSE_PASSWORD: "warehouse"
    volumes:
      - ./airflow_505:/opt/airflow
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - ./data:/opt/airflow/data
      - ./pyspark-job:/opt/pyspark:ro
      - ./beam-java/target/beam-ingestion.jar:/opt/airflow/beam-java/target/beam-ingestion.jar

  # SPRING API 
  spring-api:
    build:
      context: ./spring-api
      dockerfile: Dockerfile
    image: spring-api:0.0.1
    container_name: spring-api
    ports:
      - "8081:8081"
    environment:
      AIRFLOW_API_URL: http://airflow-webserver:8080/api/v1/dags/sor_ingestion_phase1
      AIRFLOW_API_USERNAME: airflow
      AIRFLOW_API_PASSWORD: airflow
    volumes:
      - ./data:/opt/airflow/data
      - ./pyspark-job:/opt/pyspark:ro
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  postgres-db-volume:
  warehouse-db-volume: